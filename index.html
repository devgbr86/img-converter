<!doctype html>
<html lang="pt-BR">

<head>
     <meta charset="utf-8" />
     <meta name="viewport" content="width=device-width,initial-scale=1" />
     <title>JPGpress</title>
     <link rel="stylesheet" href="./style.css" />
</head>

<body>

     <header class="app-header">
          <div>
               <h1>JPGpress</h1>
               <p>PNG · WebP · qualquer imagem → JPG comprimido — processamento local, zero upload</p>
          </div>
          <span class="badge">client-side only</span>
     </header>

     <main>

          <div class="upload-row">
               <label class="upload-btn">
                    <input id="file" type="file" accept="image/*" multiple>
                    + Selecionar
               </label>
               <div id="drop" class="drop-zone" tabindex="0">
                    Arraste imagens aqui
               </div>
          </div>

          <div class="controls">
               <div class="spacer"></div>
               <button id="convert" class="action-btn convert-btn">Prensar Todas</button>
               <button id="downloadAll" class="action-btn download-all-btn">Baixar Todas</button>
          </div>

          <div class="thumbs" id="thumbs"></div>

     </main>

     <footer class="app-footer">
          <span>Compressão via <code>&lt;canvas&gt;</code> + <code>toBlob('image/jpeg')</code></span>
          <a href="https://github.com/liberstack" target="_blank" rel="noopener">github.com/liberstack ↗</a>
     </footer>

     <script src="./store.js"></script>
     <script src="./press.js"></script>
     <script src="./ui.js"></script>
     <script src="./main.js"></script>
</body>

</html>
